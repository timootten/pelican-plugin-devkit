; Development PHP overrides - loaded after the image's zz-pelican.ini.

; Keep opcache on for speed, but re-check every file on every request so
; edited plugin classes take effect without restarting the container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

; Plugin files get added and removed at runtime; a stale realpath cache makes
; those look like they are still missing.
realpath_cache_size = 4096K
realpath_cache_ttl = 4

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 256M
post_max_size = 256M

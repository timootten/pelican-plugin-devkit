# Pelican plugin development stack.
#
#   docker compose up -d
#
# Everything (database, redis, admin user, node, Wings config.yml) is created
# automatically by the one-shot `provision` service. See ./dev.php for helpers.
#
# Hostnames: the panel and Wings are reachable under the SAME name from your
# browser and from inside the Docker network, which is what makes the console
# websocket, file manager and panel -> Wings API calls all work at once.
# Run `php dev.php hosts` once so *.pelican.test resolves to 127.0.0.1.

name: pelican-dev

x-panel-environment:
  &panel-environment # Dev mode: verbose errors, no production optimisations.
  APP_ENV: local
  APP_DEBUG: "true"
  APP_INSTALLED: "true"
  APP_URL: http://${PANEL_HOST:-panel.pelican.test}
  APP_TIMEZONE: ${TZ:-UTC}
  LOG_LEVEL: debug
  XDG_DATA_HOME: /pelican-data

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-panel}
  DB_USERNAME: ${POSTGRES_USER:-pelican}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-pelican}

  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: no-reply@${PANEL_HOST:-panel.pelican.test}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panel}
      POSTGRES_USER: ${POSTGRES_USER:-pelican}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelican}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Named volume, not ./data: Postgres refuses to start on a Windows bind
    # mount because it cannot enforce 0700 on its data directory.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pelican} -d ${POSTGRES_DB:-panel}",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  panel:
    image: ghcr.io/pelican/panel:latest
    restart: unless-stopped
    # Wrapper runs the upstream entrypoint, then tears down the caches that
    # would otherwise hide plugin changes until the next restart.
    entrypoint: ["/bin/ash", "/dev-entrypoint.sh"]
    command: ["supervisord", "-n", "-c", "/etc/supervisord.conf"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PANEL_PORT:-80}:80"
    environment:
      <<: *panel-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/panel:/pelican-data
      - ./data/logs:/var/www/html/storage/logs
      - ./plugins:/var/www/html/plugins
      - ./docker/panel/dev-entrypoint.sh:/dev-entrypoint.sh:ro
      - ./docker/panel/php-dev.ini:/usr/local/etc/php/conf.d/zzz-pelican-dev.ini:ro
    networks:
      default:
        aliases:
          - ${PANEL_HOST:-panel.pelican.test}

  wings:
    image: ghcr.io/pelican/wings:latest
    restart: unless-stopped
    command:
      ["/usr/bin/wings", "--config", "/etc/pelican/config.yml", "--debug"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tty: true
    ports:
      - "${WINGS_PORT:-8080}:8080"
      - "${WINGS_SFTP_PORT:-2022}:2022"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      # Must be the SAME path inside and outside the container: Wings asks the
      # Docker daemon to bind paths below /var/lib/pelican into the game server
      # containers (server volumes, plus passwd/group/machine-id from
      # /var/lib/pelican/etc), so the daemon has to resolve them too.
      - /var/lib/pelican:/var/lib/pelican
      - /var/log/pelican:/var/log/pelican
      - /tmp/pelican:/tmp/pelican
      # Only config.yml lives here, so a Windows bind mount is safe.
      - ./data/wings:/etc/pelican
    networks:
      default:
        aliases:
          - ${WINGS_HOST:-wings.pelican.test}

volumes:
  postgres-data:

networks:
  default:
    name: pelican-dev
